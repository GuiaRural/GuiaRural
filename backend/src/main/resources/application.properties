spring.application.name=backend

# URL de conexão (com sslmode=require no final)
spring.datasource.url=${DB_URL}?user=${DB_USER}&password=${DB_PASSWORD}

# Driver oficial do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Sessão do painel administrativo: cookie HttpOnly (o JavaScript não lê) e SameSite=Strict.
# Em produção (HTTPS) defina SESSION_COOKIE_SECURE=true no ambiente.
server.servlet.session.cookie.name=GUIARURAL_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Tempo sem uso até a sessão expirar; com "manter conectado", o segundo.
guiarural.auth.session-timeout=8h
guiarural.auth.remember-timeout=7d
