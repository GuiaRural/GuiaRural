# Perfil dos testes: banco em memória (H2), sem Supabase nem .env. Este arquivo vale só para os testes e
# substitui o application.properties principal, que continua apontando para o PostgreSQL.
spring.application.name=backend

# NON_KEYWORDS: "value" e "at" são nomes de colunas nas nossas tabelas e palavras reservadas no H2.
spring.datasource.url=jdbc:h2:mem:guiarural-test;MODE=PostgreSQL;NON_KEYWORDS=VALUE,AT;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# As tabelas nascem das entidades (no banco real, das migrations em supabase/migrations).
spring.jpa.hibernate.ddl-auto=create-drop
